<div class="w-full max-w-md mx-auto my-6">
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
    <!-- Sky background -->
    <rect x="0" y="0" width="400" height="300" fill="#e0f2fe" />

    <!-- Sun -->
    <circle cx="320" cy="50" r="30" fill="#fbbf24" opacity="0.8" />

    <!-- Mountain back -->
    <polygon points="50,300 200,80 350,300" fill="#94a3b8" />

    <!-- Mountain front -->
    <polygon points="0,300 150,120 300,300" fill="#64748b" />

    <!-- Snow cap -->
    <polygon points="150,120 180,160 120,160" fill="#f8fafc" />

    <!-- Climber body -->
    <circle cx="180" cy="145" r="6" fill="#1e293b" />
    <line x1="180" y1="151" x2="180" y2="165" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="155" x2="170" y2="148" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="155" x2="195" y2="150" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="165" x2="172" y2="175" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="165" x2="188" y2="175" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Flag pole -->
    <line x1="195" y1="150" x2="195" y2="115" stroke="#475569" stroke-width="2" />

    <!-- Flag -->
    <polygon points="195,115 225,122 195,129" fill="#0ea5e9" />

    <!-- OpenSpec text on flag -->
    <text x="200" y="125" font-size="6" fill="white" font-family="sans-serif" font-weight="bold">OS</text>

    <!-- Ground -->
    <rect x="0" y="280" width="400" height="20" fill="#22c55e" opacity="0.3" />
  </svg>
</div>
