<div class="w-full max-w-md mx-auto my-6">
  <div
    class="illustration-scene relative rounded-2xl overflow-hidden shadow-lg"
    [class.is-launching]="isLaunching()"
    [class.has-launched]="hasLaunched()"
  >
    <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto block">
      <!-- Fondo espacial -->
      <defs>
        <radialGradient id="spaceGradient" cx="50%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#1e1b4b" />
          <stop offset="100%" stop-color="#0b0f2e" />
        </radialGradient>
        <radialGradient id="planetGradient" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#7dd3fc" />
          <stop offset="100%" stop-color="#0ea5e9" />
        </radialGradient>
      </defs>

      <rect x="0" y="0" width="400" height="300" fill="url(#spaceGradient)" />

      <!-- Estrellas -->
      <circle class="star" style="animation-delay: 0s" cx="30" cy="30" r="1.4" fill="#ffffff" />
      <circle class="star" style="animation-delay: .4s" cx="80" cy="70" r="1" fill="#ffffff" />
      <circle class="star" style="animation-delay: .8s" cx="140" cy="30" r="1.2" fill="#ffffff" />
      <circle class="star" style="animation-delay: 1.2s" cx="20" cy="140" r="1" fill="#ffffff" />
      <circle class="star" style="animation-delay: .2s" cx="240" cy="50" r="1.3" fill="#ffffff" />
      <circle class="star" style="animation-delay: .6s" cx="60" cy="220" r="1" fill="#ffffff" />
      <circle class="star" style="animation-delay: 1s" cx="180" cy="180" r="1.1" fill="#ffffff" />
      <circle class="star" style="animation-delay: 1.4s" cx="340" cy="180" r="1.2" fill="#ffffff" />
      <circle class="star" style="animation-delay: .3s" cx="370" cy="240" r="1" fill="#ffffff" />
      <circle class="star" style="animation-delay: .9s" cx="120" cy="250" r="1" fill="#ffffff" />

      <!-- Planeta OpenSpec (destino) -->
      <g class="planet-group">
        <circle cx="335" cy="55" r="34" fill="url(#planetGradient)" />
        <ellipse cx="335" cy="55" rx="46" ry="10" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
        <text x="335" y="59" font-size="10" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">OpenSpec</text>
      </g>

      <!-- Astronautas flotando (abstención / dudas) -->
      <g class="astronaut astronaut-1">
        <circle cx="70" cy="90" r="7" fill="#e2e8f0" />
        <circle cx="70" cy="90" r="4.5" fill="#0b0f2e" />
        <rect x="63" y="97" width="14" height="16" rx="5" fill="#e2e8f0" />
      </g>
      <g class="astronaut astronaut-2">
        <circle cx="310" cy="160" r="6" fill="#e2e8f0" />
        <circle cx="310" cy="160" r="3.8" fill="#0b0f2e" />
        <rect x="304" y="166" width="12" height="14" rx="4" fill="#e2e8f0" />
      </g>

      <!-- Asteroides / gravedad (tensión del voto "No") -->
      @for (i of asteroidIndices(); track i) {
        <polygon
          class="asteroid"
          [style.animation-delay.s]="i * 0.35"
          [attr.points]="asteroidPoints(i)"
          fill="#78716c"
        />
      }

      <!-- Plataforma de lanzamiento -->
      <rect x="150" y="260" width="100" height="10" rx="2" fill="#334155" />
      <rect x="170" y="270" width="60" height="10" fill="#1e293b" />

      <!-- Cohete -->
      <g class="rocket">
        <!-- Llamas / propulsores (combustible = votos "Sí") -->
        <g class="flame" [style.--fuel]="yesPercentage()">
          <polygon points="192,258 208,258 200,285" fill="#fbbf24" />
          <polygon points="195,258 205,258 200,275" fill="#f97316" />
        </g>

        <!-- Cuerpo del cohete -->
        <polygon points="200,150 214,200 186,200" fill="#e2e8f0" />
        <rect x="186" y="200" width="28" height="55" rx="4" fill="#f1f5f9" />
        <circle cx="200" cy="215" r="8" fill="#38bdf8" opacity="0.9" />
        <polygon points="186,225 172,250 186,245" fill="#0ea5e9" />
        <polygon points="214,225 228,250 214,245" fill="#0ea5e9" />

        <!-- Bandera OpenSpec en el cohete -->
        <text x="200" y="240" font-size="7" fill="#0b0f2e" font-family="sans-serif" font-weight="bold" text-anchor="middle">OS</text>
      </g>
    </svg>

    @if (hasLaunched()) {
      <div class="launch-badge">🚀 ¡Despegue exitoso!</div>
    }
  </div>

  <!-- Medidor de combustible -->
  <div class="mt-3 px-1">
    <div class="flex justify-between mb-1 text-xs font-medium text-gray-600">
      <span>⛽ Combustible (votos "Sí")</span>
      <span>{{ yesPercentage() }}% · umbral de despegue {{ launchThreshold }}%</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
      <div
        class="fuel-bar h-3 rounded-full transition-all duration-700"
        [class.fuel-bar-ready]="hasEnoughFuel()"
        [style.width.%]="yesPercentage()"
      ></div>
    </div>
  </div>

  <p class="sr-only" aria-live="polite">{{ statusText() }}</p>
</div>
