<div class="space-y-4">
  <p class="text-gray-700 font-medium">¿Adoptamos OpenSpec?</p>

  <div class="flex gap-4 justify-center">
    <button
      (click)="vote(true)"
      [disabled]="voteService.loading()"
      [class.ring-2]="voteService.myVote()?.vote === true"
      [class.ring-green-500]="voteService.myVote()?.vote === true"
      class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
    >
      @if (voteService.loading() && voteService.myVote()?.vote !== true) {
        <span>Enviando...</span>
      } @else {
        <span>Sí</span>
      }
    </button>

    <button
      (click)="vote(false)"
      [disabled]="voteService.loading()"
      [class.ring-2]="voteService.myVote()?.vote === false"
      [class.ring-red-500]="voteService.myVote()?.vote === false"
      class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium"
    >
      @if (voteService.loading() && voteService.myVote()?.vote !== false) {
        <span>Enviando...</span>
      } @else {
        <span>No</span>
      }
    </button>
  </div>

  @if (voteService.myVote()) {
    <p class="text-sm text-gray-500">
      Tu voto actual: <span class="font-semibold">{{ voteService.myVote()?.vote ? 'Sí' : 'No' }}</span>
      — puedes cambiarlo pulsando el otro botón.
    </p>
  }
</div>
