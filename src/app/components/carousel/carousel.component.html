<section
  class="carousel"
  [attr.aria-label]="ariaLabel()"
  tabindex="0"
  (keydown)="onKeydown($event)"
>
  @if (currentSlide(); as slide) {
    <div class="carousel-heading">
      <span class="carousel-kicker">Antes de votar</span>
      <h2 [attr.id]="panelId() + '-heading'">{{ slide.label }}</h2>
      <p aria-live="polite">Diapositiva {{ activeSlide() + 1 }} de {{ slides().length }}</p>
    </div>

    <div
      class="carousel-viewport"
      role="tabpanel"
      [id]="panelId()"
      [attr.aria-labelledby]="tabId(activeSlide())"
    >
      @if (slideTemplate(); as template) {
        <ng-container
          [ngTemplateOutlet]="template"
          [ngTemplateOutletContext]="{ $implicit: slide, slide: slide, index: activeSlide() }"
        />
      }
    </div>

    <div class="carousel-controls">
      <button
        type="button"
        class="carousel-arrow"
        aria-label="Diapositiva anterior"
        [attr.aria-controls]="panelId()"
        (click)="previousSlide()"
      >
        <span aria-hidden="true">←</span>
        Anterior
      </button>

      <div class="carousel-dots" role="tablist" aria-label="Seleccionar diapositiva">
        @for (item of slides(); track item.id; let i = $index) {
          <button
            type="button"
            role="tab"
            [id]="tabId(i)"
            [attr.aria-selected]="activeSlide() === i"
            [attr.aria-controls]="panelId()"
            [attr.aria-label]="'Ir a: ' + item.label"
            [class.active]="activeSlide() === i"
            (click)="selectSlide(i)"
          >
            <span aria-hidden="true"></span>
          </button>
        }
      </div>

      <button
        type="button"
        class="carousel-arrow"
        aria-label="Diapositiva siguiente"
        [attr.aria-controls]="panelId()"
        (click)="nextSlide()"
      >
        Siguiente
        <span aria-hidden="true">→</span>
      </button>
    </div>
  }
</section>
