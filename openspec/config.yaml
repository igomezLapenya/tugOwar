schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: tugOwar — Angular frontend poll app for deciding whether to adopt OpenSpec.
  Repository profile: frontend-app.
  Stack: Angular 19 + TypeScript + Tailwind CSS frontend, Supabase Auth/Postgres backend,
  GitHub OAuth for login, and SQL migrations under supabase/migrations/.
  Key docs are AGENTS.md and docs/README.md.
  SDD workflow docs should live at docs/03-conventions/sdd-workflow.md.
  Environment values come from .env/.env.example and are rendered by scripts/generate-env.js;
  generated src/environments/environment*.ts files are ignored and must not be edited by hand.
  Security note: src/app/allowed-voters.ts is client UX only; Supabase RLS in
  supabase/migrations/0002_allowed_voters.sql is the voting authorization boundary.
  Manual verification for GitHub OAuth, allowed-voter checks, and two-account E2E may still
  require a human browser session; record evidence in reports.

# Per-artifact rules
rules:
  sdd:
    - "Follow docs/03-conventions/sdd-workflow.md when it exists; otherwise follow the globally installed OPSX/OpenSpec workflow skills."
    - "Use global OPSX commands only; this repository was initialized with openspec init --tools none."
    - "OpenCode uses /opsx-* hyphen syntax; Cursor, Claude Code, and Codex use /opsx:* colon syntax."
  tasks:
    - "Step 0 must create or switch to the feature branch for the change"
    - "Use OpenSpec checkbox format only: '- [ ] X.Y Description'"
    - "Include verification tasks (tests run by code-writer, confirmed by implementer)"
    - "Store implementation test reports under the change reports/ directory"
    - "Update consumer docs when APIs or behavior change"
