schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Proyecto: tugOwar — web de encuesta (sí/no) sobre la adopción de OpenSpec.
  Stack decidido: Angular + Tailwind CSS (frontend), Supabase como backend
  (Auth con provider GitHub, Postgres para votos). NO hay CSV: la decisión
  inicial de CSV fue reemplazada por Supabase.
  Proyecto Supabase: URL y key en variables de entorno (.env, ver .env.example), no en el repo.
  Reglas de negocio: un voto por usuario (unique por user_id), el usuario
  puede CAMBIAR su voto (upsert), tally agregado visible tras votar (RPC,
  sin exponer votos individuales).
  Visual: montaña con un escalador que porta una bandera de OpenSpec.
  Estado: greenfield — no existe código de producto todavía.

# Per-artifact rules
rules:
  tasks:
    - "Step 0 must create or switch to the feature branch for the change"
    - "Use OpenSpec checkbox format only: '- [ ] X.Y Description'"
    - "Include verification tasks (tests run by code-writer, confirmed by implementer)"
    - "Store implementation test reports under the change reports/ directory"
    - "Update consumer docs when APIs or behavior change"
